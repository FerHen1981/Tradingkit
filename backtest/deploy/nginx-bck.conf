# /etc/nginx/sites-available/bck.mex-traders.com  (symlink into sites-enabled)
server {
    listen 80;
    server_name bck.mex-traders.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name bck.mex-traders.com;

    ssl_certificate     /etc/letsencrypt/live/bck.mex-traders.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bck.mex-traders.com/privkey.pem;

    # big dataset uploads (300MB+ exports) streamed straight to the app
    client_max_body_size 2048m;

    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_request_buffering off;   # stream the upload; don't buffer to a temp file
        proxy_read_timeout 900s;       # cataloging a multi-million-row file takes a while
    }
}
