# Who may log in, and what they get to see.
#
# Copy to the path in PORTAL_USERS (default /etc/mex-portal/users.yaml) and
# keep it out of git — it is an access-control list, not configuration.
#
# Roles
#   owner    full figures in USD, plus /admin (sessions, audit, revoke)
#   partner  full figures in USD, read-only
#   viewer   units only — ticks, R, percentages. The server never sends this
#            role a currency field, so there is nothing to reveal client-side.
#
# An unrecognised role is demoted to viewer rather than rejected, so a typo
# narrows access instead of widening it. Removing somebody here and pressing
# "users.yaml opnieuw laden" in /admin cuts them off during a live session.

users:
  - email: ferry.hendriks@outlook.com
    name: Ferry Hendriks
    role: owner

